<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Masking Tool</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>Local Masking Tool</h1>
          <p id="runtimeStatus">画像を選択してください</p>
        </div>
        <div class="topbar-actions">
          <label class="file-button">
            <input id="fileInput" type="file" accept="image/*" multiple />
            画像を開く
          </label>
          <button id="clearImageButton" class="danger" type="button" disabled>画像をクリア</button>
          <button id="exportButton" type="button" disabled>書き出し</button>
        </div>
      </header>

      <section class="workspace">
        <aside class="side-panel">
          <div class="control-group image-panel">
            <div class="region-header">
              <h2>画像 <output id="imageCount">0</output></h2>
              <button id="clearAllButton" class="danger compact" type="button" disabled>
                すべてクリア
              </button>
            </div>
            <ul id="imageList" class="image-list"></ul>
          </div>

          <div class="control-group">
            <h2>検知</h2>
            <button id="detectFacesButton" type="button" disabled>顔を検知</button>
            <button id="detectPlatesButton" type="button" disabled>ナンバー候補を検知</button>
          </div>

          <div class="control-group">
            <h2>手動追加</h2>
            <div class="button-row">
              <button id="addFaceButton" type="button" disabled>顔</button>
              <button id="addPlateButton" type="button" disabled>ナンバー</button>
            </div>
          </div>

          <div class="control-group">
            <h2>ぼかし</h2>
            <label class="range-row">
              <span>強さ</span>
              <input id="blurInput" type="range" min="4" max="48" value="18" />
              <output id="blurValue">18</output>
            </label>
            <label class="toggle-row">
              <input id="previewToggle" type="checkbox" checked />
              <span>プレビュー</span>
            </label>
          </div>

          <div class="control-group">
            <h2>書き出し</h2>
            <label class="select-row">
              <span>形式</span>
              <select id="exportFormatInput">
                <option value="image/jpeg">JPEG</option>
                <option value="image/png">PNG</option>
              </select>
            </label>
            <label class="range-row" id="qualityRow">
              <span>品質</span>
              <input id="exportQualityInput" type="range" min="60" max="98" value="88" />
              <output id="exportQualityValue">88</output>
            </label>
          </div>

          <div class="control-group region-panel">
            <div class="region-header">
              <h2>対象</h2>
              <button id="deleteButton" class="danger" type="button" disabled>削除</button>
            </div>
            <ul id="regionList" class="region-list"></ul>
          </div>
        </aside>

        <section id="stagePanel" class="stage-panel" aria-label="編集エリア">
          <div id="emptyState" class="empty-state">
            <strong>画像をここにドロップ</strong>
            <span>JPEG / PNG / WebP・複数枚対応</span>
          </div>
          <div id="dropIndicator" class="drop-indicator" role="status" hidden>
            <strong>画像をドロップして追加</strong>
          </div>
          <div id="stage" class="stage" hidden>
            <canvas id="imageCanvas"></canvas>
            <div id="overlay" class="overlay"></div>
          </div>
        </section>
      </section>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
